name: Deploy homepage to GitHub Pages

# Builds the Vite site and publishes dist/ to GitHub Pages.
# Manual-only: enable Pages first (Settings -> Pages -> Source: GitHub Actions),
# then run this from the Actions tab. (Primary hosting is Netlify — see
# netlify.toml.) Kept manual so it doesn't fail on every push while Pages is off.
on:
  workflow_dispatch:

# Allow the workflow to publish to Pages via OIDC.
permissions:
  contents: read
  pages: write
  id-token: write

# One in-flight deployment at a time; don't cancel a running publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Configure Pages
        # Requires Pages to be enabled once in Settings -> Pages -> Source:
        # "GitHub Actions" (creating a Pages site needs repo-admin, which the
        # CI token does not have). After that one-time step this just reads the
        # existing config and every push deploys automatically.
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
