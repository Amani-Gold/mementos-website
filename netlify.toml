# Netlify build settings for the Mementos Studio homepage (Vite).
# Connect this repo in Netlify (New site -> Import from GitHub), pick the branch,
# and Netlify reads this file — no dashboard configuration needed.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Long-cache the hashed build assets; keep HTML always fresh.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
